services:
  traefik:
    image: traefik:v3.7.15
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      frontend:
        condition: service_started
      admin:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    init: true
    command: npm run dev --workspace frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://backend:3001/api/v1
      NUXT_SITE_URL: http://127.0.0.1:8080
      NUXT_SITE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./frontend:/app/frontend
      - ./packages:/app/packages:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/frontend/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entryPoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      backend:
        condition: service_started

  # Backoffice : servi sous /admin sur la même origine que le site, donc sans
  # CORS. Sa priorité passe devant le routeur `frontend` (PathPrefix `/`).
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: dev
    init: true
    command: npm run dev --workspace admin
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://backend:3001/api/v1
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3002:3002'
    volumes:
      - ./admin:/app/admin
      - /app/admin/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=PathPrefix(`/admin`)
      - traefik.http.routers.admin.entryPoints=web
      - traefik.http.routers.admin.priority=10
      - traefik.http.services.admin.loadbalancer.server.port=3002
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    init: true
    command: npm run dev --workspace backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://scalar:scalar@postgres:5432/scalar
      # Le moteur n'est joignable que par ce réseau interne : il n'est jamais
      # exposé par Traefik, ni appelé depuis le navigateur.
      PISTON_URL: http://piston:2000/api/v2
      # Doit correspondre exactement au paquet installé dans Piston.
      PISTON_NODE_VERSION: '20.11.1'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - /app/backend/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.backend.entryPoints=web
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=3001
    depends_on:
      # Les migrations tournent au démarrage du backend : la base doit déjà
      # accepter les connexions, pas seulement avoir un conteneur lancé.
      postgres:
        condition: service_healthy
      piston-setup:
        condition: service_completed_successfully

  # Moteur d'exécution du code soumis par les utilisateurs.
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: 5000
      PISTON_RUN_CPU_TIME: 5000
      PISTON_RUN_MEMORY_LIMIT: 268435456
      PISTON_OUTPUT_MAX_SIZE: 65536
      PISTON_DISABLE_NETWORKING: 'true'
      PISTON_MAX_FILE_SIZE: 1000000
      PISTON_MAX_CONCURRENT_JOBS: 8
      PISTON_LOG_LEVEL: INFO
    ports:
      - '127.0.0.1:2000:2000'
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

  # Initialisation ponctuelle du runtime Node dans Piston.
  piston-setup:
    image: curlimages/curl:8.12.1
    environment:
      PISTON_URL: http://piston:2000/api/v2
      PISTON_NODE_VERSION: '20.11.1'
    volumes:
      - ./piston/setup.sh:/setup.sh:ro
    entrypoint: ['/bin/sh', '/setup.sh']
    depends_on:
      piston:
        condition: service_started

  # Identifiants de développement local uniquement : le port n'est lié qu'à la
  # boucle locale.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: scalar
      POSTGRES_PASSWORD: scalar
      POSTGRES_DB: scalar
    ports:
      # 5433 côté hôte : évite le conflit avec un PostgreSQL déjà installé.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scalar -d scalar']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  piston-packages:

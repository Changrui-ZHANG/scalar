services:
  traefik:
    image: traefik:v3.7.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: npm run dev --workspace frontend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNE: http://backend:3001/api/v1
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entryPoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: npm run dev --workspace backend
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/scalar
      # Le moteur n'est joignable que par ce reseau interne : il n'est jamais
      # expose par Traefik, ni appele depuis le navigateur.
      PISTON_URL: http://piston:2000/api/v2
      # Doit correspondre exactement au paquet installe dans Piston. Piston
      # refuse en 400 une version qu'il n'a pas. Voir README.
      PISTON_NODE_VERSION: '20.11.1'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.backend.entryPoints=web
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=3001
    depends_on:
      mongo:
        condition: service_started
      piston:
        condition: service_started

  # Moteur d'execution du code soumis par les utilisateurs.
  #
  # Aucun label Traefik, et le port est lie a la boucle locale : seul `backend`
  # l'appelle, jamais le navigateur. `privileged` est une exigence du moteur et
  # non un choix -- son bac a sable `isolate` ne demarre pas sans, et il rend ce
  # conteneur equivalent-root sur l'hote : ne rien partager avec `mongo`.
  #
  # L'image n'embarque aucun langage. Apres le premier demarrage, installer le
  # runtime Node une fois (voir README) ; le volume le conserve ensuite.
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    environment:
      # Ces deux plafonds doivent rester alignes avec `RUN_TIMEOUT_MS` dans
      # `backend/src/services/exercices.service.ts` : Piston refuse en 400 toute
      # limite demandee au-dela de sa propre configuration, il ne la rabote pas.
      PISTON_RUN_TIMEOUT: 5000
      PISTON_RUN_CPU_TIME: 5000
      # Le defaut est de 1 Kio par flux, qu'un affichage banal depasse -- et
      # l'execution est alors tuee avec le statut `OL`.
      PISTON_OUTPUT_MAX_SIZE: 65536
    ports:
      - '127.0.0.1:2000:2000'
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

  mongo:
    image: mongo:8.0.29
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  piston-packages:

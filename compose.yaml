# Environnement de developpement. Origine unique derriere Traefik :
# tout passe par http://localhost:8080, /api/v1 est un chemin, pas un hote.
# Les labels sont ceux que lira le Traefik de Coolify en production.

services:
  traefik:
    image: traefik:v3.7.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entryPoints.web.address=:80
      # Tableau de bord sans authentification : developpement seulement, et le
      # port n'est publie que sur la boucle locale (voir `ports`). Il n'a rien
      # a faire dans le compose de production, qui reste a ecrire.
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
      # Explicite plutot qu'implicite : c'est cette ligne qui fait que Traefik
      # ecrase le `X-Forwarded-For` fourni par un client non de confiance. Sans
      # elle, la borne tiendrait sur un defaut de version, et le nombre de sauts
      # declare dans `@scalar/shared/proxy.ts` cesserait de decrire la realite sans
      # qu'aucun test ne le voie.
      - --entryPoints.web.forwardedHeaders.insecure=false
      # Genereux, jamais infini : le flux d'evenements d'une execution sandbox
      # ne doit pas etre coupe avant sa fin, mais desactiver les delais sur
      # tout l'entrypoint retirerait aussi la protection contre les connexions
      # tenues ouvertes sans rien envoyer. A reconcilier avec la duree maximale
      # d'execution le jour ou l'epic 2 la declare.
      - --entryPoints.web.transport.respondingTimeouts.readTimeout=600s
      - --entryPoints.web.transport.respondingTimeouts.writeTimeout=600s
      - --entryPoints.web.transport.respondingTimeouts.idleTimeout=600s
    # Boucle locale seulement : ni le produit ni le tableau de bord n'ont a
    # etre joignables depuis le reseau local pendant le developpement.
    ports:
      - '127.0.0.1:8080:80'
      - '127.0.0.1:8081:8080'
    volumes:
      # Lecture seule : Traefik decouvre les services, il n'ecrit rien.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bordure
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: npm run dev --workspace frontend
    environment:
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: /api/v1
      # Le rendu serveur n'emprunte pas le proxy : il lui faut une base absolue
      # sur le reseau interne, et il propage lui-meme la session et l'identite
      # de client que Traefik aurait portees.
      NUXT_API_INTERNE: http://backend:3001/api/v1
    volumes:
      - ./frontend:/app/frontend
      # Les contrats sont montes comme l'espace qui les consomme : sans cette
      # ligne, le conteneur servirait la copie figee dans l'image et une
      # edition sur l'hote resterait invisible.
      - ./shared:/app/shared
      # Volumes anonymes : le montage de l'hote recouvrirait sinon les
      # `node_modules` installes dans l'image, que l'hote n'a pas au meme
      # endroit. Un par espace monte, `shared` compris.
      - /app/frontend/node_modules
      - /app/shared/node_modules
      - /app/node_modules
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entryPoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks:
      - bordure

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: npm run dev --workspace backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/scalar?replicaSet=rs0
      # Explicite, jamais implicite : c'est cette valeur qui retire l'attribut
      # `Secure` du cookie de session. Le compose sert en clair sur localhost,
      # ou un cookie `Secure` ne serait jamais renvoye par le navigateur.
      NODE_ENV: development
      # Developpement uniquement. En production la valeur vient du gestionnaire
      # de secrets : deux deploiements qui la partageraient rendraient leurs
      # pseudonymes comparables.
      SECRET_PSEUDONYMISATION: developpement-pseudonymisation-local
    volumes:
      - ./backend:/app/backend
      # Les contrats sont montes comme l'espace qui les consomme : sans cette
      # ligne, le conteneur servirait la copie figee dans l'image et une
      # edition sur l'hote resterait invisible.
      - ./shared:/app/shared
      # Volumes anonymes : le montage de l'hote recouvrirait sinon les
      # `node_modules` installes dans l'image, que l'hote n'a pas au meme
      # endroit. Un par espace monte, `shared` compris.
      - /app/backend/node_modules
      - /app/shared/node_modules
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api/v1`)
      - traefik.http.routers.backend.entryPoints=web
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=3001
    # Seul service des deux reseaux : joignable par le proxy et par le rendu
    # serveur, et seul a atteindre la base.
    networks:
      - bordure
      - donnees

  mongo:
    image: mongo:8.0.29
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Sain seulement une fois le replica set reellement initialise.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'rs.status().ok']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - donnees

  mongo-init:
    image: mongo:8.0.29
    restart: 'no'
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./docker/mongo-init.js:/init.js:ro
    entrypoint:
      - bash
      - -c
      - >
        until mongosh --host mongo --quiet --eval 'db.adminCommand("ping")' > /dev/null 2>&1;
        do sleep 1; done;
        mongosh --host mongo --quiet /init.js
    networks:
      - donnees

# Deux reseaux plutot qu'un. L'identite de client se resout par position dans
# la chaine de transfert : elle suppose que rien d'autre que le
# proxy et le rendu serveur ne parle au backend. Le reseau par defaut unique
# faisait de cette supposition une convention ; ces deux reseaux en font une
# frontiere. A tenir quand le workspace `runner/`, qui executera du code non
# fiable, rejoindra le compose : il n'a rien a faire sur `bordure`.
networks:
  bordure:
  donnees:

volumes:
  mongo-data:

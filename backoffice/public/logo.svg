<svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 35 35" role="img" aria-label="Scalar">
  <!-- Logo Scalar : carre de la marque, « S » trace (aucune police requise), ombre portee nette.
       Sert de favicon et de logo du header ; suit le theme clair ou sombre du systeme. -->
  <style>
    .shadow { fill: #19211c }

  </style>
  <rect class="shadow" x="3" y="3" width="32" height="32" rx="7" />
  <rect class="tile" width="32" height="32" rx="7" />
  <path
    class="letter"
    d="M20.6 11.6C20.1 9.9 18.5 9 16.2 9 13.4 9 11.7 10.4 11.7 12.4c0 4.6 8.9 2.3 8.9 7.2 0 2.2-1.9 3.4-4.6 3.4-2.5 0-4.2-1-4.7-2.8"
    fill="none"

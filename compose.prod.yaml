# Production : docker compose -f compose.prod.yaml up -d --build
# Variables lues dans .env (voir .env.production.example), jamais versionné.
name: scalar-prod

x-restart: &restart
  restart: unless-stopped

services:
  traefik:
    <<: *restart
    image: traefik:v3.7.15
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`scalar-prod`)
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.tls.certResolver=letsencrypt
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL:?}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  frontend:
    <<: *restart
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://backend:3001/api/v1
      NUXT_SITE_URL: https://${DOMAIN:?}
      NUXT_SITE_ENV: production
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entryPoints=websecure
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      - backend

  admin:
    <<: *restart
    build:
      context: .
      dockerfile: admin/Dockerfile
      target: prod
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_BASE: http://backend:3001/api/v1
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${DOMAIN}`) && PathPrefix(`/admin`)
      - traefik.http.routers.admin.entryPoints=websecure
      - traefik.http.routers.admin.priority=10
      - traefik.http.services.admin.loadbalancer.server.port=3002
    depends_on:
      - backend

  backend:
    <<: *restart
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgres://scalar:${POSTGRES_PASSWORD:?}@postgres:5432/scalar
      JWT_SECRET: ${JWT_SECRET:?}
      PISTON_URL: http://piston:2000/api/v2
      # Doit correspondre exactement au paquet installé par piston-setup.
      PISTON_NODE_VERSION: '20.11.1'
      FRONTEND_URL: https://${DOMAIN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)
      - traefik.http.routers.backend.entryPoints=websecure
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=3001
    depends_on:
      postgres:
        condition: service_healthy
      piston-setup:
        condition: service_completed_successfully

  # Jamais exposé : seul le backend l'appelle, par le réseau interne.
  piston:
    <<: *restart
    image: ghcr.io/engineer-man/piston
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: 5000
      PISTON_RUN_CPU_TIME: 5000
      PISTON_RUN_MEMORY_LIMIT: 268435456
      PISTON_OUTPUT_MAX_SIZE: 65536
      PISTON_DISABLE_NETWORKING: 'true'
      PISTON_MAX_FILE_SIZE: 1000000
      PISTON_MAX_CONCURRENT_JOBS: 8
      PISTON_LOG_LEVEL: INFO
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

  piston-setup:
    image: curlimages/curl:8.12.1
    environment:
      PISTON_URL: http://piston:2000/api/v2
      PISTON_NODE_VERSION: '20.11.1'
    volumes:
      - ./piston/setup.sh:/setup.sh:ro
    entrypoint: ['/bin/sh', '/setup.sh']
    depends_on:
      - piston

  postgres:
    <<: *restart
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: scalar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: scalar
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scalar -d scalar']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  letsencrypt:
  postgres-data:
  piston-packages:

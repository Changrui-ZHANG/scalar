<style>
  .scalar-loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #ffffff;
    color: #52525b;
    font-family: system-ui, sans-serif;
    font-size: 14px;
  }

  .scalar-loader__spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e4e4e7;
    border-top-color: #52525b;
    border-radius: 50%;
    animation: scalar-loader-spin 0.8s linear infinite;
  }

  @keyframes scalar-loader-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-color-scheme: dark) {
    .scalar-loader {
      background: #18181b;
      color: #a1a1aa;
    }

    .scalar-loader__spinner {
      border-color: #3f3f46;
      border-top-color: #a1a1aa;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .scalar-loader__spinner {
      animation: none;
    }
  }
</style>

<div class="scalar-loader" role="status">
  <div class="scalar-loader__spinner" aria-hidden="true"></div>
  <span>Chargement…</span>
</div>

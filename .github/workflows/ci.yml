name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: scalar
          POSTGRES_PASSWORD: scalar
          POSTGRES_DB: scalar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scalar -d scalar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      # Prisma 6 a des avis « high » corrigés seulement en Prisma 7 (migration repoussée après la soutenance).
      - name: npm audit (high, informatif)
        continue-on-error: true
        run: |
          status=0
          {
            echo '### npm audit (high)'
            echo '```'
            npm audit --audit-level=high || status=$?
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
        env:
          DATABASE_URL_TEST: postgres://scalar:scalar@localhost:5432/scalar_test

  docker:
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            target: prod
          - name: admin
            dockerfile: admin/Dockerfile
            target: prod
          - name: backend
            dockerfile: backend/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: scalar-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/scout-action@v1.30.0
        with:
          command: cves
          image: scalar-${{ matrix.name }}:ci
          only-severities: critical,high
          exit-code: true

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://scalar:scalar@localhost:5432/scalar_test
      DATABASE_TESTS: '1'
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: scalar
          POSTGRES_PASSWORD: scalar
          POSTGRES_DB: scalar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scalar -d scalar_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            target: prod
          - name: admin
            dockerfile: admin/Dockerfile
            target: prod
          - name: backend
            dockerfile: backend/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
